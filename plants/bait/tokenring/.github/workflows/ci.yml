name: CI

on: [push, pull_request]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install ruff==0.15.22 pytest==8.3.4 bandit==1.9.2 pip-audit==2.9.0
      - run: make check
      - run: make security
