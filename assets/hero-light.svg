<path d="M489 131 l6 5 -6 5" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M703 136 h20" stroke="#8c959f" stroke-width="1.5"/>
<path d="M719 131 l6 5 -6 5" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="40" y="232" width="288" height="30" rx="15" fill="#fff8c5" stroke="#9a6700"/>
<text x="60" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#7d4e00">plants 11/11 · 2 rules untested</text>
<text x="342" y="247" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#59636e">The badge is a coverage count with a date, not a grade — a green check is a claim too,</text>
<text x="342" y="264" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#59636e">so every row states who ran it, on which bait, and why it passed.</text>
</svg>
